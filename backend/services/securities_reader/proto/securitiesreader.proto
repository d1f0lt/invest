// Contract for the securities_reader service: read-only access to the latest
// known price per security (GetPrices - mirrors the previous
// "GET /api/v1/prices" HTTP endpoint 1:1) and to the candles price_updater
// keeps for price charts (GetCandles), plus search over the securities
// reference (SearchSecurities). Formerly price_reader.
syntax = "proto3";

package invest.securitiesreader.v1;

option go_package = "invest/backend/services/securities_reader/proto;securitiesreaderpb";

import "google/protobuf/timestamp.proto";

// GetPrices carries no auth requirement at this level, same as the old
// HTTP endpoint: securities_reader has never checked caller identity itself,
// only gateway gates access to it (requireAuth) before ever proxying a
// call through.
service SecuritiesReaderService {
  rpc GetPrices(GetPricesRequest) returns (GetPricesResponse);
  rpc GetCandles(GetCandlesRequest) returns (GetCandlesResponse);
  // Search by ticker (SECID), short/full name or ISIN for the asset search
  // screen. Case-insensitive, "ё" == "е".
  rpc SearchSecurities(SearchSecuritiesRequest) returns (SearchSecuritiesResponse);
}

message GetPricesRequest {
  // Empty -> latest price for every security price_updater has ever
  // recorded, same as omitting "?tickers=" on the old HTTP endpoint.
  repeated string tickers = 1;
}

message PriceView {
  string secid = 1;
  string board = 2;
  optional string short_name = 3;
  optional string sec_name = 4;
  optional string isin = 5;
  optional string currency = 6;
  optional double last_price = 7;
  optional double open_price = 8;
  optional double high_price = 9;
  optional double low_price = 10;
  optional double value_today = 11;
  optional int64 volume_today = 12;
  optional string trading_status = 13;
  optional string moex_update_time = 14;
  google.protobuf.Timestamp collected_at = 15;
}

message GetPricesResponse {
  repeated PriceView prices = 1;
}

// Chart period. The server picks the candle size for each:
//   DAY   - hourly candles of the last trading day (today while trading,
//           otherwise the most recent day with trades)
//   WEEK  - daily candles of the last 7 days
//   MONTH - daily candles of the last month
//   YEAR  - daily candles of the last year
//   ALL   - weekly candles over the whole stored history
enum CandleRange {
  CANDLE_RANGE_UNSPECIFIED = 0;
  CANDLE_RANGE_DAY = 1;
  CANDLE_RANGE_WEEK = 2;
  CANDLE_RANGE_MONTH = 3;
  CANDLE_RANGE_YEAR = 4;
  CANDLE_RANGE_ALL = 5;
}

enum CandleInterval {
  CANDLE_INTERVAL_UNSPECIFIED = 0;
  CANDLE_INTERVAL_HOUR = 1;
  CANDLE_INTERVAL_DAY = 2;
  CANDLE_INTERVAL_WEEK = 3;
}

message GetCandlesRequest {
  string secid = 1;
  // Optional. Empty -> the only board price_updater knows the security
  // on; InvalidArgument if it trades on several.
  string board = 2;
  CandleRange range = 3;
}

// Prices are in the same units as GetPrices: money for shares/funds,
// % of face value for bonds.
message Candle {
  google.protobuf.Timestamp start = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  // Daily/weekly candles only.
  optional int64 volume = 6;
  optional double value = 7;
}

message GetCandlesResponse {
  string secid = 1;
  string board = 2;
  CandleRange range = 3;
  CandleInterval interval = 4;
  // Oldest first.
  repeated Candle candles = 5;
}

message SearchSecuritiesRequest {
  // Required, 1..64 characters after trimming; InvalidArgument otherwise.
  string query = 1;
  // 0 -> 20; capped at 50.
  int32 limit = 2;
}

// Best matches first: exact ticker/ISIN, ticker prefix, name prefix,
// name word prefix, then substring anywhere. Within a group: shares
// (TQBR), funds (TQTF), OFZ (TQOB), corporate bonds (TQCB), then by ticker.
message SearchSecuritiesResponse {
  repeated PriceView securities = 1;
}
