name: deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Уже собранный тег для выкатки или отката, например v0.1.0"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  API_DOMAIN: d1f0lt-invest.duckdns.org

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend.yml
    with:
      docker: false

  images:
    name: push image (${{ matrix.service }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - gateway
          - notifier
          - parser
          - portfolio
          - price_updater
          - securities_reader
          - users
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE_TAG: ${{ env.TAG }}
        run: |
          sed 's/=$/=ci/' .env.example > .env
          docker compose build ${{ matrix.service }}
          docker compose push ${{ matrix.service }}

  deploy:
    name: deploy ${{ inputs.tag || github.ref_name }}
    needs: images
    if: ${{ !cancelled() && (needs.images.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.API_DOMAIN }}:8443/healthz
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "Секрет ENV_FILE пуст или не задан в environment production" >&2
            exit 1
          fi
          umask 077
          {
            printf '%s\n' "$ENV_FILE"
            echo "IMAGE_TAG=$TAG"
            echo "API_DOMAIN=$API_DOMAIN"
            echo "GATEWAY_BIND=127.0.0.1"
            echo "COMPOSE_PROFILES=https"
          } > .env
          missing=""
          for key in $(grep -oE '^[A-Z_]+=' .env.example | tr -d =); do
            grep -qE "^$key=" .env || missing="$missing $key"
          done
          if [ -n "$missing" ]; then
            echo "В ENV_FILE нет ключей из .env.example:$missing" >&2
            exit 1
          fi
          docker compose config --quiet

      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload files
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          tar -czf - .env docker-compose.yml caddy scripts services/*/migrations \
            | ssh "$TARGET" 'mkdir -p /opt/invest && tar -xzf - -C /opt/invest'

      - name: Roll out
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh "$TARGET" '
            docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null || exit 1
            sh /opt/invest/scripts/deploy.sh
            rc=$?
            docker logout ghcr.io >/dev/null
            exit $rc
          '

      - name: Check https://${{ env.API_DOMAIN }}:8443/healthz
        run: curl -fsS --retry 24 --retry-delay 5 --retry-all-errors "https://$API_DOMAIN:8443/healthz"
