name: invest
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Выбор файла отчёта брокера (системный диалог выбора документа).
  file_picker: ^13.1.0
  # Хранение токенов между запусками (Keychain / Android Keystore).
  flutter_secure_storage: ^11.2.0
  # Избранные бумаги — хранятся локально на устройстве.
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
